<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NautiBoy logo</title>
  <desc id="desc">NautiBoy purple-neon cat icon with wordmark and Nautilus LCD Controller descriptor.</desc>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".54" stop-color="#ffffff"/><stop offset=".55" stop-color="#c82cff"/><stop offset="1" stop-color="#7626ff"/>
    </linearGradient>
  </defs>
  <image href="nautiboy-icon-1024.png" x="182" y="32" width="660" height="660"/>
  <text x="512" y="800" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="126" font-weight="800" letter-spacing="-5" fill="url(#word)">NautiBoy</text>
  <text x="512" y="874" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="500" letter-spacing="10" fill="#aab9ff">NAUTILUS LCD CONTROLLER</text>
</svg>

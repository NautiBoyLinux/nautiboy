<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NautiBoy icon</title>
  <desc id="desc">Black spiky cat-head silhouette outlined in purple neon inside a rounded neon square.</desc>
  <defs>
    <radialGradient id="panel" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#4b008f" stop-opacity=".72"/>
      <stop offset=".62" stop-color="#170032" stop-opacity=".93"/>
      <stop offset="1" stop-color="#08000f" stop-opacity=".98"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4dff"/>
      <stop offset=".45" stop-color="#cf20ff"/>
      <stop offset="1" stop-color="#7817ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="near"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="near"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="92" y="92" width="840" height="840" rx="172" fill="url(#panel)" stroke="#8f19ff" stroke-opacity=".34" stroke-width="70" filter="url(#glow)"/>
  <rect x="92" y="92" width="840" height="840" rx="172" fill="none" stroke="url(#neon)" stroke-width="26"/>
  <path d="M212 256 L384 356 L406 286 L470 344 L512 236 L561 344 L625 287 L642 356 L813 255 L755 506 L828 541 L777 594 L824 636 L760 668 C760 788 656 862 512 862 C368 862 264 788 264 668 L200 636 L247 594 L196 541 L269 506 Z"
        fill="#030104" stroke="url(#neon)" stroke-width="24" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M276 704 L220 786 L330 733 M748 704 L804 786 L694 733" fill="#030104" stroke="url(#neon)" stroke-width="20" stroke-linejoin="round" filter="url(#glow)"/>
</svg>

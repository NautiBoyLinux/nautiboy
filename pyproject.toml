[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nautiboy"
version = "0.2.0.dev0"
description = "Open-source Linux controller for Corsair NAUTILUS RS LCD displays"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "NautiBoy contributors"}]
dependencies = [
  "Pillow>=10,<13",
  "PySide6>=6.7,<7",
  "pyudev>=0.24,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.gui-scripts]
nautiboy = "nautiboy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nautiboy"]

[tool.hatch.build.targets.sdist]
include = [
  "/ATTRIBUTION.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/packaging",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
